<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ==========================================================================
     Nothing on this page is edited here — all copy lives in /content.js.
     This file is just the skeleton; render.js fills it from your content.
     ========================================================================== -->

<title>Portfolio</title>
<meta name="description" content="">
<meta name="theme-color" content="#f7f2e9">
<meta name="color-scheme" content="light dark">

<meta property="og:type" content="website">
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:image" content="">
<meta property="og:url" content="">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Caveat:wght@600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!-- Preloader ---------------------------------------------------------- -->
<div class="preloader" id="preloader" aria-hidden="true">
  <div class="preloader__inner"></div>
  <span class="preloader__bar" id="preloaderBar"></span>
</div>

<div class="cursor" id="cursor" aria-hidden="true"></div>
<div class="progress" id="progress" aria-hidden="true"></div>

<!-- Floating pill nav -------------------------------------------------- -->
<header class="header" id="header">
  <div class="header__bar">
    <a class="brand" href="#top" data-brand></a>

    <nav class="nav nav--desktop" id="navDesktop" aria-label="Primary"></nav>

    <div class="header__actions">
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch to dark theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" id="themeIcon">
          <path d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.7-5.7 1.4-1.4M4.9 19.1l1.4-1.4m11.4 0 1.4 1.4M4.9 4.9l1.4 1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/>
        </svg>
      </button>
      <a class="btn" id="headerCta" href="#contact"></a>
      <button class="icon-btn burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<!-- Mobile menu -------------------------------------------------------- -->
<div class="menu" id="menu" aria-hidden="true">
  <nav aria-label="Mobile">
    <ul class="menu__list" id="menuList"></ul>
  </nav>
  <div class="menu__foot" id="menuFoot"></div>
</div>

<main id="main">

<!-- Hero --------------------------------------------------------------- -->
<section class="hero" id="top">
  <div class="hero__glow" aria-hidden="true"></div>
  <div class="shell hero__inner">

    <p class="chip" id="heroChip" data-reveal></p>
    <h1 class="hero__name" id="heroName" data-reveal style="--delay:60ms"></h1>
    <p class="hero__role" id="heroRole" data-reveal style="--delay:120ms"></p>

    <!-- floats, award seal and portrait are injected here -->
    <div class="hero__stage" id="heroStage" data-reveal style="--delay:180ms"></div>

    <div class="hero__actions" id="heroActions" data-reveal style="--delay:240ms"></div>

    <div class="hero__aside" data-reveal style="--delay:300ms">
      <div class="socials" id="heroSocials"></div>
      <div class="reviews" id="heroReviews"></div>
    </div>

  </div>
</section>

<!-- Marquee ------------------------------------------------------------ -->
<div class="marquee" aria-hidden="true">
  <div class="marquee__track" id="marqueeTrack" data-marquee></div>
</div>

<!-- Showreel ----------------------------------------------------------- -->
<section class="section" id="reel">
  <div class="shell">
    <div class="sec-head" id="reelHead"></div>

    <button class="reel" id="reelBtn" type="button" data-reveal aria-haspopup="dialog">
      <svg class="reel__bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs><linearGradient id="reelG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2b2118"/><stop offset="1" stop-color="#151310"/>
        </linearGradient></defs>
        <rect width="1600" height="900" fill="url(#reelG)"/>
        <g fill="none" stroke="#f7f2e9" stroke-width="1" opacity=".14">
          <path d="M0 300 Q 400 140 800 300 T 1600 300"/>
          <path d="M0 450 Q 400 290 800 450 T 1600 450"/>
          <path d="M0 600 Q 400 440 800 600 T 1600 600"/>
          <path d="M0 750 Q 400 590 800 750 T 1600 750"/>
        </g>
        <g opacity=".8">
          <circle class="anim a-pulse"    cx="230"  cy="220" r="34" fill="#f0a32c"/>
          <circle class="anim a-pulse d2" cx="1380" cy="680" r="24" fill="#f0a32c"/>
          <rect class="anim a-rise d1"    x="1300" y="200" width="70" height="70" rx="14"
                fill="none" stroke="#f7f2e9" stroke-width="2" opacity=".55"/>
          <rect class="anim a-morph d3"   x="200"  y="640" width="80" height="80" rx="20"
                fill="none" stroke="#f7f2e9" stroke-width="2" opacity=".55"/>
        </g>
      </svg>

      <span class="reel__play">
        <span class="reel__disc">
          <svg width="24" height="28" viewBox="0 0 26 30" fill="currentColor" aria-hidden="true"><path d="M0 0v30l26-15z"/></svg>
        </span>
      </span>

      <span class="reel__meta" id="reelMeta" aria-hidden="true"></span>
    </button>
  </div>
</section>

<!-- Work --------------------------------------------------------------- -->
<section class="section" id="work">
  <div class="shell">
    <div class="sec-head" id="workHead"></div>
    <div class="work__grid" id="workGrid"></div>
  </div>
</section>

<!-- Brand identity ----------------------------------------------------- -->
<section class="section" id="identity">
  <div class="shell">
    <div class="sec-head" id="identityHead"></div>
    <div class="brands" id="identityGrid"></div>
    <div class="deliverables" id="identityDeliverables"></div>
  </div>
</section>

<!-- About -------------------------------------------------------------- -->
<section class="section" id="about">
  <div class="shell">
    <div class="about">
      <div class="about__media" id="aboutMedia" data-reveal></div>
      <div id="aboutBody"></div>
    </div>
  </div>
</section>

<!-- Tools -------------------------------------------------------------- -->
<section class="section section--panel" id="tools">
  <div class="shell center">
    <div class="sec-head" id="toolsHead"></div>
    <div class="tools" id="toolsGrid"></div>
  </div>
</section>

<!-- Services ----------------------------------------------------------- -->
<section class="section" id="services">
  <div class="shell">
    <div class="sec-head" id="servicesHead"></div>
    <div id="servicesList"></div>
  </div>
</section>

<!-- Journey ------------------------------------------------------------ -->
<section class="section" id="journey">
  <div class="shell">
    <div class="sec-head" id="journeyHead"></div>
    <div class="journey" id="journeyGrid"></div>
  </div>
</section>

<!-- Awards ------------------------------------------------------------- -->
<section class="section section--tight" id="awards">
  <div class="shell">
    <div class="sec-head" id="awardsHead"></div>
    <div class="awards" id="awardsGrid"></div>
  </div>
</section>

<!-- Process ------------------------------------------------------------ -->
<section class="section section--panel" id="process">
  <div class="shell center">
    <div class="sec-head" id="processHead"></div>
    <div class="process" id="processGrid" style="text-align:left"></div>
  </div>
</section>

<!-- Testimonials ------------------------------------------------------- -->
<section class="section" id="words">
  <div class="shell">
    <div class="about">
      <div id="wordsHead"></div>
      <div class="card quotes" id="quotes" data-reveal></div>
    </div>
  </div>
</section>

<!-- CTA ---------------------------------------------------------------- -->
<section class="cta" id="contact">
  <span class="cta__glow" aria-hidden="true"></span>
  <div id="ctaBody"></div>
</section>

</main>

<!-- Footer ------------------------------------------------------------- -->
<footer class="footer">
  <div class="shell">
    <div class="footer__grid">
      <div>
        <a class="brand" href="#top" data-brand></a>
        <p id="footerBlurb" style="color:var(--fg-2);margin-top:1rem;max-width:28ch;font-size:var(--t-sm)"></p>
      </div>
      <!-- footer columns are appended here -->
    </div>

    <div class="footer__bottom">
      <span id="footerNote"></span>
      <a class="to-top" href="#top">
        Back to top
        <svg width="10" height="12" viewBox="0 0 12 14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M6 13V2M1.5 6.5 6 2l4.5 4.5"/>
        </svg>
      </a>
    </div>
  </div>
</footer>

<!-- Showreel modal ----------------------------------------------------- -->
<div class="modal" id="reelModal" role="dialog" aria-modal="true" aria-label="Showreel" aria-hidden="true">
  <button class="modal__close" id="reelClose" type="button" aria-label="Close showreel">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M2 2l12 12M14 2L2 14"/>
    </svg>
  </button>
  <div class="modal__frame" id="reelFrame"></div>
</div>

<!-- ① your content, ② the renderer, ③ the interaction layer ------------- -->
<script src="content.js" defer></script>
<script src="assets/js/render.js" defer></script>
<script src="assets/js/main.js" defer></script>
</body>
</html>
